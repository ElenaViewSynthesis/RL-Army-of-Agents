<text x="10" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f1e1c" text-anchor="start" font-weight="bold">eagle_attention_committed</text>
<text x="10" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#55544f" text-anchor="start" font-weight="normal">The heavy kernel. One program takes a tile of 128 query rows of a GQA group and one split of 4,096 committed keys.</text>
<text x="10" y="362" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#55544f" text-anchor="start" font-weight="normal">It walks the split in 64 blocks of 64 keys: load the key and value block once, score Q·Kᵀ on the tensor cores, update the</text>
<text x="10" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#55544f" text-anchor="start" font-weight="normal">running maximum and normaliser (online softmax), add P·V on the tensor cores, then store its partial result in its split slot.</text>
