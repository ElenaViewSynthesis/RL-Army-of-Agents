<text x="269.3" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#55544f" text-anchor="end" font-weight="normal">4</text>
<text x="158" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f1e1c" text-anchor="end" font-weight="normal">Candidate top-k</text>
<line x1="206.4" x2="388.8" y1="130.0" y2="130.0" stroke="#c3c2b7" stroke-width="2"/>
