<text x="448.8" y="166" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#55544f" text-anchor="middle" font-weight="normal">100×</text>
<line x1="570.0" x2="570.0" y1="26" y2="150" stroke="#e1e0d9" stroke-width="1"/>
