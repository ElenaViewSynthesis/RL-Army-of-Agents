<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-label="Dumbbell chart, log scale: repeated reads of the same data, untuned against tuned, for tree verify attention, tree row attention and candidate top-k.">
<rect width="640" height="190" fill="#ffffff"/>
<circle cx="170" cy="12" r="4.5" fill="#eb6834"/><text x="179" y="16" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#55544f" text-anchor="start" font-weight="normal">Untuned</text>
<circle cx="240" cy="12" r="4.5" fill="#2a78d6"/><text x="249" y="16" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#55544f" text-anchor="start" font-weight="normal">Tuned</text>
<line x1="206.4" x2="206.4" y1="26" y2="150" stroke="#e1e0d9" stroke-width="1"/>
