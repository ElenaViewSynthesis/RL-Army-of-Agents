<text x="269.3" y="54.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#55544f" text-anchor="end" font-weight="normal">4</text>
<text x="158" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f1e1c" text-anchor="end" font-weight="normal">Tree row attention</text>
<line x1="279.3" x2="534.8" y1="90.0" y2="90.0" stroke="#c3c2b7" stroke-width="2"/>
<circle cx="534.8" cy="90.0" r="5.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="279.3" cy="90.0" r="5.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
