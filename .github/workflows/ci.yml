name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          # Run only the MVP package tests to avoid collecting unrelated tests
          pytest langchain-deep-agents/tests -q

  agenticrl-cuda-kernels:
    # Torch-free suite: GPU, Torch, Triton, W&B and Modal tests skip explicitly.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgenticRL-CUDA-kernels
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional test dependency
        run: python -m pip install pyyaml

      - name: Run the Torch-free test suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover

