name: AgenticRL CUDA kernels

# Torch-free test suite for AgenticRL-CUDA-kernels. GPU, Torch, Triton, W&B
# and Modal tests skip explicitly; GPU evidence comes from Modal H200 runs
# recorded in AgenticRL-CUDA-kernels/artifacts/runs/.
on:
  push:
    branches: [ main ]
    paths:
      - 'AgenticRL-CUDA-kernels/**'
      - '.github/workflows/agenticrl-cuda-kernels.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'AgenticRL-CUDA-kernels/**'
      - '.github/workflows/agenticrl-cuda-kernels.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  torch-free-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AgenticRL-CUDA-kernels
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional test dependency
        run: python -m pip install pyyaml

      - name: Run the Torch-free test suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover
